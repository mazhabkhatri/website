<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Mazhab — creator, designer and teacher."
  />

  <title>Mazhab — Creator, Designer & Teacher</title>

  <!-- Outfit Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       TOP HEADER
       ===================================================== -->

  <header class="top-header">

    <!-- Your Logo -->
    <a href="/" class="site-logo">
      <img
        src="assets/logo.png"
        alt="Mazhab"
      >
    </a>

    <!-- Navigation -->
    <nav
      class="top-navigation"
      id="top-navigation"
      aria-label="Main navigation"
    ></nav>

  </header>


  <main class="site-container">

    <!-- ===================================================
         PROFILE / INTRO
         =================================================== -->

    <section class="intro">

      <img
        src="assets/profile.png"
        alt="Mazhab"
        class="profile-image"
      >

      <h1 id="intro-title"></h1>

      <p id="intro-description"></p>

    </section>


    <!-- ===================================================
         CREATING
         =================================================== -->

    <section class="content-section">

      <h2>Creating</h2>

      <div
        id="creating-list"
        class="link-list"
      ></div>

    </section>


    <!-- ===================================================
         RESOURCES
         =================================================== -->

    <section class="content-section">

      <h2>Resources</h2>

      <div
        id="resources-list"
        class="link-list"
      ></div>

    </section>


    <!-- ===================================================
         POSTS
         =================================================== -->

    <section class="content-section">

      <h2>Posts</h2>

      <div
        id="posts-list"
        class="link-list"
      ></div>

      <a
        id="posts-all-link"
        class="see-all"
        href="#"
      >
        See all posts →
      </a>

    </section>


    <!-- ===================================================
         CURRENTLY
         =================================================== -->

    <section class="content-section currently-section">

      <h2>Currently</h2>

      <div id="currently-list"></div>

    </section>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer>

  <div
    class="footer-name"
    id="footer-name"
  ></div>

  <div
    class="footer-role"
    id="footer-role"
  ></div>

      <div
        class="footer-links"
        id="footer-links"
      ></div>

      <div
        class="copyright"
        id="copyright"
      ></div>

    </footer>

  </main>


  <script src="content.js"></script>
  <script src="script.js"></script>

</body>
</html>
