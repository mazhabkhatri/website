<!DOCTYPE html>
<html lang="en">

<head>

  <!-- =====================================================
       BASIC
       ===================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Mazhab — creator, designer and teacher."
  >

  <title>mazhab — Creator, Designer & Teacher</title>


  <!-- =====================================================
       FAVICON
       ===================================================== -->

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link
    rel="apple-touch-icon"
    href="logo.png"
  >


  <!-- =====================================================
       FONT
       ===================================================== -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       STYLESHEET
       ===================================================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       TOP HEADER
       ===================================================== -->

  <header class="top-header">

    <!-- Logo -->

    <a
      href="#top"
      class="site-logo"
      aria-label="Home"
    >

      <img
        src="logo.png"
        alt="mazhab"
      >

    </a>


    <!-- Navigation -->

    <nav
      class="top-navigation"
      id="top-navigation"
      aria-label="Main navigation"
    ></nav>

  </header>



  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main id="top">


    <!-- ===================================================
         HERO / FLIP IDENTITY
         =================================================== -->

    <section
      class="hero-section"
      id="hero"
      aria-label="Introduction"
    >

      <div class="hero-flip-container">

        <div
          class="hero-flip"
          id="hero-flip"
        >


          <!-- =============================================
               FRONT
               ============================================= -->

          <div class="hero-face hero-front">

            <div class="hero-front-content">

              <h1 id="hero-name">
                mazhab
              </h1>

              <p id="hero-tagline">
                a boy who follows his passion.
              </p>

            </div>

          </div>



          <!-- =============================================
               BACK
               ============================================= -->

          <div class="hero-face hero-back">

            <div class="hero-back-content">


              <!-- Profile photo -->

              <button
  class="hero-profile-button"
  id="hero-profile-button"
  type="button"
  aria-label="Flip introduction"
>
  <img
    src="profile.png"
    alt="Mazhab"
    class="hero-profile"
  >
</button>


              <!-- Introduction -->

              <h2 id="hero-intro">
                I'm Mazhab.
              </h2>


              <!-- Role -->

              <p
                class="hero-role"
                id="hero-role"
              >
                Creator · Designer · Teacher
              </p>


              <!-- Word-by-word description -->

              <p
                class="hero-description"
                id="hero-description"
              ></p>


            </div>

          </div>

        </div>

      </div>

    </section>



    <!-- ===================================================
         MAIN CONTENT
         =================================================== -->

    <div class="main-content">


      <!-- =================================================
           01 — CONTENT
           ================================================= -->

      <section
        class="content-section"
        id="content-section"
      >

        <div class="section-heading">

          <span class="section-number">
            01
          </span>

          <h2>
            Content
          </h2>

        </div>


        <div
          class="section-list"
          id="content-list"
        ></div>

      </section>



      <!-- =================================================
           02 — DIGITAL PRODUCTS
           ================================================= -->

      <section
        class="content-section"
        id="digital-products-section"
      >

        <div class="section-heading">

          <span class="section-number">
            02
          </span>

          <h2>
            Digital Products
          </h2>

        </div>


        <div
          class="section-list"
          id="digital-products-list"
        ></div>

      </section>



      <!-- =================================================
           03 — DESIGN
           ================================================= -->

      <section
        class="content-section design-section"
        id="design-section"
      >

        <div class="section-heading">

          <span class="section-number">
            03
          </span>

          <h2>
            Design
          </h2>

        </div>



        <!-- ===============================================
             LOGO DESIGN
             =============================================== -->

        <div class="design-category">

          <button
            class="design-category-button"
            type="button"
            data-category="logoDesign"
            aria-expanded="false"
          >

            <span>
              Logo Design
            </span>

            <span class="category-arrow">
              →
            </span>

          </button>


          <div
            class="design-projects"
            id="logo-design-projects"
            aria-hidden="true"
          ></div>

        </div>



        <!-- ===============================================
             BRAND IDENTITY
             =============================================== -->

        <div class="design-category">

          <button
            class="design-category-button"
            type="button"
            data-category="brandIdentity"
            aria-expanded="false"
          >

            <span>
              Brand Identity
            </span>

            <span class="category-arrow">
              →
            </span>

          </button>


          <div
            class="design-projects"
            id="brand-identity-projects"
            aria-hidden="true"
          ></div>

        </div>

      </section>


    </div>



    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer>

      <div class="footer-inner">


        <!-- Name -->

        <div
          class="footer-name"
          id="footer-name"
        >
          Mazhab
        </div>


        <!-- Role -->

        <div
          class="footer-role"
          id="footer-role"
        >
          Creator · Designer · Teacher
        </div>


        <!-- Social links -->

        <div
          class="footer-links"
          id="footer-links"
        ></div>


        <!-- Copyright -->

        <div
          class="copyright"
          id="copyright"
        >
          © 2026 Mazhab. All Rights Reserved.
        </div>


      </div>

    </footer>


  </main>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script src="content.js"></script>

  <script src="script.js"></script>


</body>

</html>
